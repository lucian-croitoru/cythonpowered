version: '3.8'

services:
  test-py314:
    build:
      context: .
      dockerfile: tests/containerized/Dockerfile.py314
    image: cythonpowered:test-py314
    container_name: cythonpowered-test-py314
    environment:
      PYTHONUNBUFFERED: 1
    command: python -c "import cythonpowered; print(f'✓ cythonpowered {cythonpowered.VERSION} installed'); from cythonpowered.random import random; print('✓ Cython modules compiled and working')"

